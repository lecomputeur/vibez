[package]
name = "vibez-tauri-preview"
version = "0.1.3"
description = "Experimental Tauri desktop client for Mistral Vibe"
edition = "2021"
license = "MIT"
authors = ["Le Computeur"]
build = "build.rs"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["unstable", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "=2.4.1"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tokio = { version = "1", features = ["sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
semver = "1"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"
gtk = "0.18"
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "screenshot"] }

[profile.release]
opt-level = "s"
lto = false
strip = true
codegen-units = 16

[profile.dev]
debug = 0
