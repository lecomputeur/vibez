Section "ServerFlags"
  Option "AutoAddDevices" "false"
  Option "AutoEnableDevices" "false"
  Option "DontVTSwitch" "true"
EndSection
Section "Device"
  Identifier "Dummy"
  Driver "dummy"
  VideoRam 256000
EndSection
Section "Monitor"
  Identifier "Monitor"
  HorizSync 5.0-200.0
  VertRefresh 5.0-200.0
  Modeline "1280x900" 108.00 1280 1328 1440 1688 900 901 904 1066 +HSync +VSync
EndSection
Section "Screen"
  Identifier "Screen"
  Device "Dummy"
  Monitor "Monitor"
  DefaultDepth 24
  SubSection "Display"
    Depth 24
    Virtual 2560 1000
    Modes "1280x900"
  EndSubSection
EndSection
