<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VibeZ · Screenshot</title><link rel="stylesheet" href="screenshot.css"><script src="translations.js" defer></script><script src="preview-translations.js" defer></script><script src="common.js" defer></script><script src="screenshot.js" defer></script></head>
<body><main>
<header><div class="heading"><img src="icon.png" width="38" height="38" alt=""><div><p class="eyebrow">VibeZ · 3.0.2 · test 3</p><h1 data-i18n="screenshot">Screenshot</h1></div></div><button id="close" class="close" type="button" aria-label="Close">×</button></header>
<section id="choose" aria-labelledby="question"><h2 id="question" data-shot="question">What would you like to capture?</h2><p class="intro" data-shot="scope">Choose a part of the page open in VibeZ.</p>
<div class="choices">
<button class="choice" type="button" data-mode="visible" disabled><span class="icon"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="5" width="24" height="20" rx="3"/><path d="M4 11h24M12 29h8M16 25v4"/></svg></span><span class="copy"><strong data-extra="screenshotVisible">Visible page</strong><span data-shot="visibleHelp">Only what you can see now, without the toolbar.</span></span><span class="arrow" aria-hidden="true">›</span></button>
<button class="choice" type="button" data-mode="full" disabled><span class="icon"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 3h12l5 5v21H8zM20 3v6h5M12 14h9M12 19h9M12 24h6"/></svg></span><span class="copy"><strong data-extra="screenshotFull">Full page</strong><span data-shot="fullHelp">The loaded page, including content below the screen.</span></span><span class="arrow" aria-hidden="true">›</span></button>
<button class="choice" type="button" data-mode="selection" disabled><span class="icon"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 12V5h7M20 5h7v7M27 20v7h-7M12 27H5v-7"/><path d="m12 12 12 5-6 2-2 6z"/></svg></span><span class="copy"><strong data-extra="screenshotSelection">Selection</strong><span data-shot="selectionHelp">Drag a rectangle on the page. Escape cancels.</span></span><span class="arrow" aria-hidden="true">›</span></button>
</div><p class="footnote" data-shot="loadedOnly">Full page captures content already loaded, not unloaded chat history.</p></section>
<section id="result" hidden aria-labelledby="ready-title"><h2 id="ready-title" data-shot="ready">Your screenshot</h2><div class="preview"><img id="image" alt="Screenshot preview"></div><p id="dimensions"></p><div class="result-actions"><button type="button" id="copy" class="primary" data-shot="copy">Copy</button><button type="button" id="save" class="secondary" data-shot="save">Save PNG…</button></div><button type="button" id="again" class="link" data-shot="again">Take another screenshot</button></section>
<div id="feedback" role="status" aria-live="polite"><span id="feedback-text" data-shot="initializing">Loading screenshot tools…</span></div>
<footer><span data-shot="private">No automatic uploads or messages.</span><button type="button" id="done" class="text-button" data-shot="close">Close</button></footer>
</main></body></html>
