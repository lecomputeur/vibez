<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Screenshot</title><link rel="stylesheet" href="screenshot.css"><script src="translations.js" defer></script><script src="preview-translations.js" defer></script><script src="common.js" defer></script><script src="screenshot.js" defer></script></head>
<body><main>
<header><h1 data-i18n="screenshot">Screenshot</h1><button id="close" type="button" aria-label="Close">×</button></header>
<section id="choose" aria-label="Screenshot"><div class="choices">
<button class="choice" type="button" data-mode="visible" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="15" rx="2"/><path d="M3 9h18M8 22h8"/></svg><span><strong data-extra="screenshotVisible">Visible page</strong></span></button>
<button class="choice" type="button" data-mode="full" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h9l4 4v16H6zM15 2v5h4M9 11h7M9 15h7M9 19h4"/></svg><span><strong data-extra="screenshotFull">Full page</strong></span></button>
<button class="choice" type="button" data-mode="selection" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6M9 9l9 4-4 1-1 5z"/></svg><span><strong data-extra="screenshotSelection">Selection</strong></span></button>
</div><label class="auto"><input type="checkbox" id="auto-paste" checked><span data-shot="auto">Paste directly in Vibe</span></label></section>
<section id="result" hidden aria-label="Screenshot"><div class="preview"><img id="image" alt="Screenshot preview"></div><p id="dimensions"></p><button id="paste" class="primary" type="button" data-shot="paste">Paste in Vibe</button><div class="actions"><button id="copy" type="button" data-shot="copy">Copy</button><button id="save" type="button" data-shot="save">Save PNG…</button><button id="again" type="button" data-shot="again">New</button></div></section>
<div id="feedback" role="status" aria-live="polite" hidden></div>
</main></body></html>
