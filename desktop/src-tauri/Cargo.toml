[package]
name = "vibez3"
version = "3.0.2"
description = "VibeZ 3 desktop client for Mistral Vibe"
edition = "2021"
license = "MIT"
authors = ["Le Computeur"]
build = "build.rs"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["unstable", "tray-icon", "image-png"] }
tauri-plugin-opener = "=2.7.0"
tauri-plugin-clipboard-manager = "=2.4.1"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tokio = { version = "1", features = ["sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
semver = "1"
sys-locale = "0.3"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
features = ["Win32_Globalization", "Win32_System_Com"]

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"
gtk = "0.18"
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "screenshot"] }

[profile.release]
opt-level = "s"
lto = false
strip = true
codegen-units = 16

[profile.dev]
debug = 0

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "=0.39.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-foundation = "=0.3.2"
objc2-web-kit = "=0.3.2"
