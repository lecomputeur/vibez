name: VibeZ 3.0.2 screenshot modes validation

on:
  push:
    branches: ['feature/v3.0.2-screenshot-modes']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vibez-302-screenshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux — screenshot modes + native smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      LIBGL_ALWAYS_SOFTWARE: '1'
      WEBKIT_DISABLE_DMABUF_RENDERER: '1'
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb openbox dbus-x11 imagemagick desktop-file-utils python3-gi gir1.2-gtk-3.0 gstreamer1.0-tools gstreamer1.0-plugins-good gstreamer1.0-plugins-base gstreamer1.0-plugins-bad libgdk-pixbuf2.0-bin xdg-utils
          rustup toolchain install '1.99.0' --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: vibez-302-screenshot-linux
      - name: Frontend and Rust tests
        working-directory: desktop
        run: |
          npm ci --ignore-scripts
          npm test
          cargo test --release --locked --manifest-path src-tauri/Cargo.toml
          npm run build -- --bundles deb -- --locked
      - name: Real WebKitGTK screenshot smoke
        run: bash tools/release-v3/linux-smoke.sh

  windows:
    name: Windows — screenshot modes + WebView2 + Store MSIX
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: rustup toolchain install '1.99.0' --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: vibez-302-screenshot-windows
      - name: Test and build
        working-directory: desktop
        run: |
          npm ci --ignore-scripts
          npm test
          cargo test --release --locked --manifest-path src-tauri/Cargo.toml
          npm run build -- --bundles nsis,msi -- --locked
      - name: Real WebView2 screenshot smoke
        run: python tools/release-v3/native-smoke.py desktop/src-tauri/target/release/vibez3.exe desktop/artifacts/native.log
      - name: Build and unpack-verify Store package
        shell: pwsh
        run: ./desktop/scripts/build-store.ps1 -OutputDirectory "$PWD/store-output"
      - uses: actions/upload-artifact@v5
        with:
          name: vibez-3.0.2-windows-store
          path: store-output/*.msix
          if-no-files-found: error

  macos:
    name: macOS — screenshot modes + WKWebView
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: rustup toolchain install '1.99.0' --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: vibez-302-screenshot-macos
      - name: Test and build
        working-directory: desktop
        run: |
          npm ci --ignore-scripts
          npm test
          cargo test --release --locked --manifest-path src-tauri/Cargo.toml
          npm run build -- --bundles app --no-sign -- --locked
      - name: Real WKWebView screenshot smoke
        env:
          RUST_BACKTRACE: '1'
        run: python3 tools/release-v3/native-smoke.py desktop/src-tauri/target/release/vibez3 desktop/artifacts/native.log
