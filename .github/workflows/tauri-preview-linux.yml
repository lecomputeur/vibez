name: VibeZ Tauri Preview - Linux only

on:
  push:
    branches: ['vibe/tauri-linux-preview-7c4e90']
    paths: ['tauri-preview/**', '.github/workflows/tauri-preview-linux.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vibez-tauri-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tauri-preview
        shell: bash
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify production files are untouched
        run: |
          changes="$(git diff --name-only dba23059d1cbd8fba082d95cc49f4ae46eeba0bb HEAD)"
          printf '%s\n' "$changes"
          if printf '%s\n' "$changes" | grep -Ev '^(tauri-preview/|\.github/workflows/tauri-preview-linux\.yml$|$)'; then
            echo 'Refusing to build: changes outside the isolated prototype.' >&2
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Linux build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb openbox dbus-x11 imagemagick
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-preview/src-tauri -> target
          key: isolated-linux-preview
      - name: Install only the preview build tooling
        run: npm install --ignore-scripts
      - name: Frontend and isolation tests
        run: |
          mkdir -p artifacts
          npm test 2>&1 | tee artifacts/frontend-tests.log
          npm audit --audit-level=high
      - name: Rust policy tests
        run: |
          cargo test --release --manifest-path src-tauri/Cargo.toml 2>&1 | tee artifacts/rust-tests.log
      - name: Build Linux DEB preview
        run: npm run build -- --bundles deb 2>&1 | tee artifacts/build.log
      - name: Verify package identity and extract for smoke test
        run: |
          deb="$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)"
          test -n "$deb"
          package="$(dpkg-deb -f "$deb" Package)"
          [[ "$package" == *tauri*preview* ]]
          test "$(dpkg-deb -f "$deb" Architecture)" = amd64
          dpkg-deb --info "$deb" | tee artifacts/package-info.txt
          dpkg-deb -x "$deb" artifacts/unpacked
          test -x artifacts/unpacked/usr/bin/vibez-tauri-preview
          artifacts/unpacked/usr/bin/vibez-tauri-preview --version | tee artifacts/version.txt
          grep -F '0.1.0' artifacts/version.txt
      - name: Native GTK/WebKit smoke test in isolated desktop
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/vibez-tauri-smoke/config"
          export XDG_DATA_HOME="$RUNNER_TEMP/vibez-tauri-smoke/data"
          export XDG_CACHE_HOME="$RUNNER_TEMP/vibez-tauri-smoke/cache"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME"
          export PREVIEW_BINARY="$PWD/artifacts/unpacked/usr/bin/vibez-tauri-preview"
          export PREVIEW_ARTIFACTS="$PWD/artifacts"
          timeout 70s dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1000x24' bash -c '
            openbox --sm-disable > "$PREVIEW_ARTIFACTS/openbox.log" 2>&1 &
            "$PREVIEW_BINARY" --smoke-test > "$PREVIEW_ARTIFACTS/native-smoke.log" 2>&1 &
            pid=$!
            sleep 3
            import -window root "$PREVIEW_ARTIFACTS/preview-offline-smoke.png" || true
            wait "$pid"
          '
          cat artifacts/native-smoke.log
          grep -F 'SMOKE_OK:' artifacts/native-smoke.log
      - name: Prepare verified preview artifacts
        run: |
          cp src-tauri/target/release/bundle/deb/*.deb artifacts/
          cp src-tauri/Cargo.lock artifacts/Cargo.lock
          cp package-lock.json artifacts/package-lock.json
          cp README.md artifacts/README.md
          cd artifacts
          sha256sum *.deb > SHA256SUMS
      - uses: actions/upload-artifact@v5
        with:
          name: VibeZ-Tauri-Preview-0.1.0-Linux-x64
          path: |
            tauri-preview/artifacts/*.deb
            tauri-preview/artifacts/SHA256SUMS
            tauri-preview/artifacts/README.md
            tauri-preview/artifacts/Cargo.lock
            tauri-preview/artifacts/package-lock.json
          retention-days: 30
          if-no-files-found: error
      - name: Upload validation logs even on failure
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: VibeZ-Tauri-Preview-validation
          path: |
            tauri-preview/artifacts/*.log
            tauri-preview/artifacts/*.txt
            tauri-preview/artifacts/*.png
            tauri-preview/src-tauri/Cargo.lock
            tauri-preview/package-lock.json
          retention-days: 14
          if-no-files-found: warn
