name: Reusable signed and notarized macOS build

on:
  workflow_call:
    inputs:
      arch:
        description: electron-builder architecture
        required: true
        type: string
      runner:
        description: GitHub-hosted macOS runner
        required: true
        type: string
      outdir:
        description: Directory containing the unpacked app
        required: true
        type: string
      label:
        description: Artifact label
        required: true
        type: string
    secrets:
      MAC_CERTIFICATE_P12_BASE64:
        required: true
      MAC_CERTIFICATE_PASSWORD:
        required: true
      APPLE_API_KEY_P8_BASE64:
        required: true
      APPLE_API_KEY_ID:
        required: true
      APPLE_API_ISSUER:
        required: true
      APPLE_TEAM_ID:
        required: true

permissions:
  contents: read
  actions: read

jobs:
  app:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 350
    env:
      MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
      MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Verify Apple signing configuration
        shell: bash
        run: |
          test -n "$MAC_CERTIFICATE_P12_BASE64"
          test -n "$MAC_CERTIFICATE_PASSWORD"
          test -n "$APPLE_API_KEY_P8_BASE64"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          test -n "$APPLE_TEAM_ID"

      - name: Install dependencies
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci

      - name: Decode Apple signing material
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          (temp / 'vibez-developer-id.p12').write_bytes(base64.b64decode(os.environ['MAC_CERTIFICATE_P12_BASE64']))
          (temp / 'AuthKey.p8').write_bytes(base64.b64decode(os.environ['APPLE_API_KEY_P8_BASE64']))
          PY
          chmod 600 "$RUNNER_TEMP/vibez-developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"

      - name: Build and sign macOS app
        env:
          CSC_LINK: ${{ runner.temp }}/vibez-developer-id.p12
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.build.mac.notarize = false;
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          npx electron-builder --mac zip --${{ inputs.arch }} --publish never

      - name: Verify Developer ID signature
        shell: bash
        run: |
          APP="$(find '${{ inputs.outdir }}' -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E 'Authority=Developer ID Application|TeamIdentifier='

      - name: Preserve exact signed app before notarization
        uses: actions/upload-artifact@v5
        with:
          name: recovery-macos-${{ inputs.label }}-signed-app
          path: dist/*macOS-${{ inputs.arch }}.zip
          if-no-files-found: error
          retention-days: 90

      - name: Submit app and wait for Apple
        env:
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find dist -maxdepth 1 -type f -name '*macOS-${{ inputs.arch }}.zip' -print -quit)"
          test -n "$ZIP"

          response=""
          rc=1
          for attempt in $(seq 1 10); do
            set +e
            response="$(xcrun notarytool submit "$ZIP" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --output-format json 2>&1)"
            rc=$?
            set -e
            echo "$response"
            [ "$rc" -eq 0 ] && break
            echo "Submit attempt $attempt failed; retrying in 30 seconds..."
            sleep 30
          done
          [ "$rc" -eq 0 ]

          ID="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          printf '%s\n' "$ID" | tee "$RUNNER_TEMP/app-submission-id.txt"
          echo "Submission ID: $ID"

          deadline=$(( $(date +%s) + 19800 ))
          status="Unknown"
          while [ "$(date +%s)" -lt "$deadline" ]; do
            set +e
            info="$(xcrun notarytool info "$ID" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --output-format json 2>&1)"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "Temporary Apple/network status error; retrying in 30 seconds..."
              echo "$info"
              sleep 30
              continue
            fi
            status="$(printf '%s' "$info" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status","Unknown"))')"
            echo "Notarization $ID: $status"
            case "$status" in
              Accepted) break ;;
              Invalid|Rejected)
                xcrun notarytool log "$ID" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" || true
                exit 1
                ;;
              *) sleep 30 ;;
            esac
          done
          [ "$status" = "Accepted" ]

      - name: Preserve app submission ID
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: recovery-macos-${{ inputs.label }}-app-notary-state
          path: ${{ runner.temp }}/app-submission-id.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Staple and verify app
        shell: bash
        run: |
          APP="$(find '${{ inputs.outdir }}' -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"

      - name: Recreate ZIP with stapled app
        shell: bash
        run: |
          APP="$(find '${{ inputs.outdir }}' -maxdepth 1 -type d -name '*.app' -print -quit)"
          ZIP="$(find dist -maxdepth 1 -type f -name '*macOS-${{ inputs.arch }}.zip' -print -quit)"
          test -n "$APP"
          test -n "$ZIP"
          rm -f "$ZIP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"

      - name: Upload stapled app for DMG job
        uses: actions/upload-artifact@v5
        with:
          name: internal-macos-${{ inputs.label }}-stapled-app
          path: dist/*macOS-${{ inputs.arch }}.zip
          if-no-files-found: error
          retention-days: 90

  dmg:
    needs: app
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 350
    env:
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v5

      - name: Download stapled app
        uses: actions/download-artifact@v5
        with:
          name: internal-macos-${{ inputs.label }}-stapled-app
          path: dist

      - name: Decode App Store Connect API key
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'AuthKey.p8'
          p.write_bytes(base64.b64decode(os.environ['APPLE_API_KEY_P8_BASE64']))
          p.chmod(0o600)
          PY

      - name: Restore and verify stapled app
        shell: bash
        run: |
          ZIP="$(find dist -maxdepth 1 -type f -name '*macOS-${{ inputs.arch }}.zip' -print -quit)"
          test -n "$ZIP"
          mkdir -p work/app
          ditto -x -k "$ZIP" work/app
          APP="$(find work/app -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"

      - name: Create DMG
        shell: bash
        run: |
          APP="$(find work/app -maxdepth 1 -type d -name '*.app' -print -quit)"
          ZIP="$(find dist -maxdepth 1 -type f -name '*macOS-${{ inputs.arch }}.zip' -print -quit)"
          test -n "$APP"
          test -n "$ZIP"
          VERSION="$(node -p "require('./package.json').version")"
          PRODUCT="$(node -p "require('./package.json').build.productName")"
          DMG="${ZIP%.zip}.dmg"
          hdiutil create -volname "${PRODUCT} ${VERSION}" -srcfolder "$APP" -ov -format UDZO "$DMG"

      - name: Preserve DMG before notarization
        uses: actions/upload-artifact@v5
        with:
          name: recovery-macos-${{ inputs.label }}-dmg
          path: dist/*macOS-${{ inputs.arch }}.dmg
          if-no-files-found: error
          retention-days: 90

      - name: Submit DMG and wait for Apple
        env:
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
        shell: bash
        run: |
          set -euo pipefail
          DMG="$(find dist -maxdepth 1 -type f -name '*macOS-${{ inputs.arch }}.dmg' -print -quit)"
          test -n "$DMG"

          response=""
          rc=1
          for attempt in $(seq 1 10); do
            set +e
            response="$(xcrun notarytool submit "$DMG" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --output-format json 2>&1)"
            rc=$?
            set -e
            echo "$response"
            [ "$rc" -eq 0 ] && break
            echo "Submit attempt $attempt failed; retrying in 30 seconds..."
            sleep 30
          done
          [ "$rc" -eq 0 ]

          ID="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          printf '%s\n' "$ID" | tee "$RUNNER_TEMP/dmg-submission-id.txt"
          echo "Submission ID: $ID"

          deadline=$(( $(date +%s) + 19800 ))
          status="Unknown"
          while [ "$(date +%s)" -lt "$deadline" ]; do
            set +e
            info="$(xcrun notarytool info "$ID" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --output-format json 2>&1)"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "Temporary Apple/network status error; retrying in 30 seconds..."
              echo "$info"
              sleep 30
              continue
            fi
            status="$(printf '%s' "$info" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status","Unknown"))')"
            echo "Notarization $ID: $status"
            case "$status" in
              Accepted) break ;;
              Invalid|Rejected)
                xcrun notarytool log "$ID" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" || true
                exit 1
                ;;
              *) sleep 30 ;;
            esac
          done
          [ "$status" = "Accepted" ]

      - name: Preserve DMG submission ID
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: recovery-macos-${{ inputs.label }}-dmg-notary-state
          path: ${{ runner.temp }}/dmg-submission-id.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Staple and validate DMG
        shell: bash
        run: |
          DMG="$(find dist -maxdepth 1 -type f -name '*macOS-${{ inputs.arch }}.dmg' -print -quit)"
          test -n "$DMG"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Upload final signed and notarized files
        uses: actions/upload-artifact@v5
        with:
          name: release-macos-${{ inputs.label }}
          path: |
            dist/*macOS-${{ inputs.arch }}.zip
            dist/*macOS-${{ inputs.arch }}.dmg
          if-no-files-found: error
          retention-days: 90
