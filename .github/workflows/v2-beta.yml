name: VibeZ 2.0 Beta Test

on:
  push:
    branches: [v2.0-dev]
  pull_request:
    branches: [v2.0-dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vibez-v2-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Refresh root lock metadata for beta version
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
      - run: npm test

  linux-x64:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Refresh root lock metadata for beta version
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Build isolated Linux x64 beta
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --linux AppImage --x64 --publish never
      - name: Prepare Chromium sandbox for packaged smoke test
        run: |
          SANDBOX="dist/linux-unpacked/chrome-sandbox"
          test -f "$SANDBOX"
          sudo chown root:root "$SANDBOX"
          sudo chmod 4755 "$SANDBOX"
      - name: Verify Linux x64 beta
        run: |
          test -n "$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          APP="dist/linux-unpacked/vibez2-beta"
          test -x "$APP"
          test "$("$APP" --version | tail -n 1)" = "$(node -p "require('./package.json').version")"
      - uses: actions/upload-artifact@v5
        with:
          name: VibeZ-2.0.0-beta.1-Linux-x64
          path: dist/*.AppImage
          if-no-files-found: error

  windows-x64:
    needs: test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Refresh root lock metadata for beta version
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Build isolated Windows x64 beta
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Verify Windows x64 beta
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -File -Filter '*Windows-x64.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows x64 beta installer missing.' }
          $app = 'dist\win-unpacked\vibez2-beta.exe'
          if (-not (Test-Path $app)) { throw 'Windows x64 beta executable missing.' }
          $expected = (node -p "require('./package.json').version").Trim()
          $actual = (& $app --version | Select-Object -Last 1).Trim()
          if ($actual -ne $expected) { throw "Unexpected beta version: $actual" }
      - uses: actions/upload-artifact@v5
        with:
          name: VibeZ-2.0.0-beta.1-Windows-x64-UNSIGNED
          path: dist/*Windows-x64.exe
          if-no-files-found: error

  windows-store-msix:
    needs: test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Refresh root lock metadata for beta version
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Build Microsoft Store MSIX
        shell: pwsh
        run: npm run build:store:msix
      - name: Sign, install and verify a disposable test copy
        shell: pwsh
        run: |
          $unsigned = Get-ChildItem dist\store -File -Filter '*.msix' | Select-Object -First 1
          if (-not $unsigned) { throw 'Microsoft Store MSIX is missing.' }
          $signed = Join-Path $env:RUNNER_TEMP 'VibeZ-Store-Local-Test.msix'
          Copy-Item $unsigned.FullName $signed -Force
          $publisher = 'CN=613EFBB1-83C3-495D-9C3B-D4EE98C72B95'
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -KeyUsage DigitalSignature -CertStoreLocation Cert:\CurrentUser\My
          $cer = Join-Path $env:RUNNER_TEMP 'VibeZ-Store-Local-Test.cer'
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          $trusted = Import-Certificate -FilePath $cer -CertStoreLocation Cert:\CurrentUser\TrustedPeople
          $root = Import-Certificate -FilePath $cer -CertStoreLocation Cert:\CurrentUser\Root
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object { try { [version]$_.Directory.Parent.Name } catch { [version]'0.0' } } -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw 'signtool.exe was not found in the Windows SDK.' }
          try {
            & $signTool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint $signed
            if ($LASTEXITCODE -ne 0) { throw "signtool.exe failed with exit code $LASTEXITCODE." }
            Add-AppxPackage -Path $signed
            $installed = Get-AppxPackage -Name 'LeComputeur.VibeZDesktop'
            if (-not $installed) { throw 'The locally signed MSIX did not register.' }
            if ($installed.PackageFamilyName -ne 'LeComputeur.VibeZDesktop_dpqfg82bz4ywg') {
              throw "Unexpected package family name: $($installed.PackageFamilyName)"
            }
            $app = Join-Path $installed.InstallLocation 'vibez2-beta.exe'
            $probe = Start-Process -FilePath $app -ArgumentList '--version' -PassThru
            if (-not $probe.WaitForExit(30000)) {
              Stop-Process -Id $probe.Id -Force -ErrorAction SilentlyContinue
              throw 'The installed Store executable did not finish its version probe within 30 seconds.'
            }
            if ($probe.ExitCode -ne 0) { throw "The installed Store executable returned exit code $($probe.ExitCode)." }
          } finally {
            Get-AppxPackage -Name 'LeComputeur.VibeZDesktop' | Remove-AppxPackage -ErrorAction SilentlyContinue
            Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force -ErrorAction SilentlyContinue
            if ($trusted) { Remove-Item "Cert:\CurrentUser\TrustedPeople\$($trusted.Thumbprint)" -Force -ErrorAction SilentlyContinue }
            if ($root) { Remove-Item "Cert:\CurrentUser\Root\$($root.Thumbprint)" -Force -ErrorAction SilentlyContinue }
          }
      - uses: actions/upload-artifact@v5
        with:
          name: VibeZ-2.0.0-beta.1-Windows-x64-MICROSOFT-STORE-MSIX-UNSIGNED
          path: dist/store/*.msix
          if-no-files-found: error

  macos-intel:
    needs: test
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Refresh root lock metadata for beta version
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Build isolated macOS Intel beta
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg zip --x64 --publish never
      - name: Verify macOS Intel beta
        shell: bash
        run: |
          test -n "$(find dist -maxdepth 1 -type f -name '*macOS-x64.dmg' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*macOS-x64.zip' -print -quit)"
          APP="$(find dist/mac -path '*/Contents/MacOS/*' -type f -perm +111 -print -quit)"
          test -n "$APP"
          test "$("$APP" --version | tail -n 1)" = "$(node -p "require('./package.json').version")"
      - uses: actions/upload-artifact@v5
        with:
          name: VibeZ-2.0.0-beta.1-macOS-Intel-UNSIGNED
          path: |
            dist/*macOS-x64.dmg
            dist/*macOS-x64.zip
          if-no-files-found: error

  macos-arm64:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Refresh root lock metadata for beta version
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Build isolated macOS Apple Silicon beta
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg zip --arm64 --publish never
      - name: Verify macOS Apple Silicon beta
        shell: bash
        run: |
          test -n "$(find dist -maxdepth 1 -type f -name '*macOS-arm64.dmg' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*macOS-arm64.zip' -print -quit)"
          APP="$(find dist/mac-arm64 -path '*/Contents/MacOS/*' -type f -perm +111 -print -quit)"
          if [ -z "$APP" ]; then APP="$(find dist/mac -path '*/Contents/MacOS/*' -type f -perm +111 -print -quit)"; fi
          test -n "$APP"
          test "$("$APP" --version | tail -n 1)" = "$(node -p "require('./package.json').version")"
      - uses: actions/upload-artifact@v5
        with:
          name: VibeZ-2.0.0-beta.1-macOS-Apple-Silicon-UNSIGNED
          path: |
            dist/*macOS-arm64.dmg
            dist/*macOS-arm64.zip
          if-no-files-found: error
