name: Electron 2 — manual maintenance checks

# VibeZ 3 is built in vibez-v3.yml and published by publish-v3.yml.
# A main-branch documentation/native-code merge must never overwrite 2.x assets.
# The original Electron release workflow remains in the v2.x Git history.
on:
  workflow_dispatch:
    inputs:
      legacy_ref:
        description: 'Existing Electron tag or maintenance branch to audit (no publication)'
        required: true
        default: v2.0.2
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.legacy_ref }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Preserve the legacy dependency security gate
        run: npm audit --audit-level=high
      - run: npm test
      - name: Maintenance result
        run: echo 'Legacy Electron checks completed. No release assets or Store submission were changed.' >> "$GITHUB_STEP_SUMMARY"
