name: Publish verified VibeZ 3.0.2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v3.yml', 'V3-RELEASE.md', 'tools/release-v3/release-proof.json']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-verified-vibez-3
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify exact tested source and every platform/security gate
        run: |
          test "$GITHUB_REPOSITORY" = lecomputeur/vibez
          test "$GITHUB_REF" = refs/heads/main
          python3 tools/release-v3/verify-release-proof.py
          python3 -m unittest discover -s tools/release-v3/tests -p 'test_*.py'
          echo "SOURCE=$(python3 -c 'import json; print(json.load(open("tools/release-v3/release-proof.json"))["source"])')" >> "$GITHUB_ENV"
      - name: Verify release identity, source and all twelve package checksums
        id: release_state
        run: |
          gh release view v3.0.2 --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,isDraft,isPrerelease > /tmp/release.json
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > /tmp/latest.json
          python3 - <<'PY'
          import json,os,re
          release=json.load(open('/tmp/release.json'));latest=json.load(open('/tmp/latest.json'))
          assert release['tagName']=='v3.0.2' and not release['isPrerelease']
          assert release['targetCommitish']==os.environ['SOURCE']
          match=re.fullmatch(r'v(\d+)\.(\d+)\.(\d+)',latest['tag_name'])
          assert match and tuple(map(int,match.groups()))<=(3,0,2), 'Refusing to replace a newer Latest release'
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write(f"public={str(not release['isDraft']).lower()}\n")
          PY
          mkdir -p verified-assets
          gh release download v3.0.2 --repo "$GITHUB_REPOSITORY" --dir verified-assets --pattern 'VibeZ-3.0.2-*' --pattern SHA256SUMS --pattern source-commit.txt
          VIBEZ_RELEASE_SOURCE="$SOURCE" python3 tools/release-v3/verify-published-assets.py verified-assets
          if git show-ref --verify --quiet refs/tags/v3.0.2; then
            test "$(git rev-parse 'v3.0.2^{commit}')" = "$SOURCE"
          fi
      - name: Test historical update compatibility with the actual locked updater
        if: steps.release_state.outputs.public != 'true'
        run: |
          npm ci --omit=dev --ignore-scripts
          npm audit --omit=dev --audit-level=high
          mkdir -p legacy-feed
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v2.0.2" > legacy-feed/release.json
          gh release download v2.0.2 --repo "$GITHUB_REPOSITORY" --dir legacy-feed --pattern latest.yml --pattern latest-linux.yml --pattern latest-mac.yml
          node tools/release-v3/legacy-feed.cjs legacy-feed
      - name: Publish verified VibeZ 3.0.2 as Latest
        if: steps.release_state.outputs.public != 'true'
        run: |
          gh release upload v3.0.2 legacy-feed/latest.yml legacy-feed/latest-linux.yml legacy-feed/latest-mac.yml --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit v3.0.2 --repo "$GITHUB_REPOSITORY" --target "$SOURCE" --draft=false --latest --title 'VibeZ 3.0.2 — Compact screenshots and direct paste' --notes-file V3-RELEASE.md
          test "$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name)" = v3.0.2
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/tags/v3.0.2 --jq .object.sha)" = "$SOURCE"
          echo 'VibeZ 3.0.2 is public and Latest. All twelve packages match the frozen tested source. Store MSIX is prepared; Microsoft submission and certification remain separate.' >> "$GITHUB_STEP_SUMMARY"
      - name: Sync descriptions without replacing verified binaries
        if: steps.release_state.outputs.public == 'true'
        run: |
          gh release edit v3.0.2 --repo "$GITHUB_REPOSITORY" --title 'VibeZ 3.0.2 — Compact screenshots and direct paste' --notes-file V3-RELEASE.md
          echo 'Updated release descriptions; verified package bytes and checksums were retained.' >> "$GITHUB_STEP_SUMMARY"
