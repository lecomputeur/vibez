name: Check live sitemap
on:
  push:
    branches: ['vibe/check-live-sitemap-7c1f']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live sitemap and robots
        shell: bash
        run: |
          set -euxo pipefail
          for name in sitemap.xml robots.txt
          do
            url="https://lecomputeur.github.io/vibez/$name"
            echo "=== $url ==="
            curl -fsSIL "$url"
            curl -fsSL "$url" -o "$RUNNER_TEMP/$name"
            echo "--- body ---"
            cat "$RUNNER_TEMP/$name"
            echo
          done
