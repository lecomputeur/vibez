<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self';">
  <title>VibeZ 2.0</title>
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <header class="toolbar" id="toolbar">
    <div class="brand-wrap">
      <img class="brand-icon" src="icon.png" alt="">
      <div class="brand-copy">
        <div class="brand-row"><span class="brand">VibeZ</span></div>
        <span class="subtitle">Mistral Vibe desktop</span>
      </div>
    </div>

    <nav class="nav-controls" aria-label="Navigation">
      <button class="icon-button" id="back" type="button" title="Back" aria-label="Back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <button class="icon-button" id="forward" type="button" title="Forward" aria-label="Forward">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </button>
      <button class="icon-button" id="reload" type="button" title="Reload" aria-label="Reload">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5"/><path d="M19 11a7 7 0 1 0 1 4"/></svg>
      </button>
    </nav>

    <div class="toolbar-spacer" aria-hidden="true"></div>

    <div class="toolbar-actions">
      <button class="screenshot-button" id="screenshot" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 7 1.5-2h5L16 7h3a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3Z"/><circle cx="12" cy="13" r="3"/></svg>
        <span id="screenshot-label">Screenshot</span>
      </button>
      <button class="settings-button" id="settings" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.2 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H2.4v-4h.09A1.7 1.7 0 0 0 4.2 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 8.6 4.2a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V2.4h4v.09A1.7 1.7 0 0 0 15 4.2a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 8.6a1.7 1.7 0 0 0 .6 1 1.7 1.7 0 0 0 1.1.4h.1v4h-.09A1.7 1.7 0 0 0 19.4 15Z"/></svg>
        <span id="settings-label">Settings</span>
      </button>
    </div>
    <div class="loading-line" id="loading-line"></div>
  </header>
  <script src="shell.js"></script>
</body>
</html>
